# ============================================================================
# Configuration with Fallbacks
# ============================================================================

# Uncomment to enable automatic fallbacks
# router_settings:
#   routing_strategy: simple-shuffle  # or "least-busy", "latency-based"
#   num_retries: 2
#   timeout: 60
#   
# fallbacks:
#   - claude: ["claude-haiku"]  # If claude fails, try claude-haiku

# ============================================================================
# General Settings
# ============================================================================

litellm_settings:
  # Enable detailed logging
  set_verbose: true
  
  # Drop unsupported parameters instead of erroring
  drop_params: true
  
  # Success/failure callbacks for monitoring
  # success_callback: ["langfuse", "prometheus"]
  # failure_callback: ["sentry"]

# ============================================================================
# Database Configuration (Optional - for key management)
# ============================================================================

# Uncomment to enable database for virtual keys and spend tracking
# general_settings:
