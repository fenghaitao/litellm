# LiteLLM Proxy Configuration for Anthropic
# Save this as config.yaml and run: litellm --config config.yaml

# ============================================================================
# Basic Configuration
# ============================================================================

model_list:
  # Claude 3.5 Sonnet - Balanced performance
  - model_name: claude
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY  # Reads from environment variable
  
  # Claude 3.5 Haiku - Fast and affordable
  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
  
  # Claude 3 Opus - Most capable
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-3-opus-20240229
      api_key: os.environ/ANTHROPIC_API_KEY

