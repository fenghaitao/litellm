# General settings
general_settings:
  # Master key for accessing the proxy (uses environment variable for security)
  master_key: ${LITELLM_MASTER_KEY}
  
  # Database URL - use SQLite for simple setup or PostgreSQL for production
  # SQLite example (creates a local database file):
  # database_url: "sqlite:///./litellm.db"
  # PostgreSQL example:
  # database_url: "postgresql://user:password@localhost:5432/litellm"
  
  # Allow requests even when database is unavailable (limited functionality)
  allow_requests_on_db_unavailable: true
  
  # Simple debug setting like working config
  # debug: true

# Router settings for load balancing (optional)
router_settings:
  # Timeout settings
  timeout: 60
  
  # Retry settings
  num_retries: 3
  
  # Fallback models for high availability (commented out for now)
  # fallbacks:
  #   - {"gpt-4.1": ["gpt-4", "gpt-4o"]}
  #   - {"gpt-5": ["gpt-4.1", "gpt-4"]}
  #   - {"o3-mini": ["o4-mini", "gpt-4o-mini"]}
  #   - {"claude-sonnet-4.5": ["claude-3.7-sonnet", "claude-3.5-sonnet"]}

# Proxy settings
litellm_settings:
  # Drop specific parameters if needed
  drop_params: true
  
  # Set max tokens for modern models with large context windows
  max_tokens: 128000  # 128k tokens - adjust per model if needed
  
  # Context window sizes by model family:
  # - GPT-4.1, GPT-5: 128k tokens
  # - GPT-4o models: 128k tokens  
  # - o3-mini, o4-mini: 128k tokens
  # - Claude 3.5/4.5 Sonnet: 200k tokens
  # - Claude Haiku 4.5: 200k tokens
  # - Gemini 2.0/2.5: 1M+ tokens
  # - Some models may support up to 256k or more
  
  # Temperature settings
  temperature: 0.7
  
  # Model aliases for easier access
  model_alias_map:
    "latest-gpt": "gpt-4.1"
    "latest-claude": "claude-sonnet-4.5"
    "latest-gemini": "gemini-2.5-pro"
    "fastest": "gpt-4o-mini"
    "reasoning": "o3-mini"
